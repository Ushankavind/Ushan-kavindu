<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
:root{color-scheme:dark;--ink:#07061a;--fg:#f2efff;--mute:#aaa4cc;--cyan:#38e8ff;--violet:#b56bff;--sunset:#ff7a45;--gold:#ffc857;
  --display:'Syne',system-ui,sans-serif;--body:'Space Grotesk',system-ui,sans-serif;
  --gx:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:clip}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.backdrop,.veil{position:fixed;inset:0;z-index:0;pointer-events:none}
.veil{background:linear-gradient(90deg,rgba(7,6,26,.62),rgba(7,6,26,.12) 60%,rgba(7,6,26,.25))}
.backdrop{background:linear-gradient(#07061a,#4a1870 50%,#ff7a45 62%,#07061a 63%)}
main,.foot{position:relative;z-index:1}
main{overflow-x:clip}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-left:var(--gx);padding-right:var(--gr)}
section,main>div{scroll-margin-top:0}

.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),var(--violet),var(--sunset),var(--gold));z-index:40}
.top{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 12px);left:var(--gx);right:var(--gr);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-radius:99px;background:rgba(10,8,34,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);max-width:1168px;margin-inline:auto}
.top .mark{font-family:var(--display);font-weight:800;letter-spacing:.14em;color:var(--gold)}
.top div{display:flex}
.top div button{padding:6px 12px;border-radius:99px;font-size:14px;color:var(--mute);transition:.25s}
.top div button:hover{color:var(--ink);background:var(--cyan)}

.hero{min-height:100svh;display:flex;align-items:center;padding-block:96px 56px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:center}
.hero-grid>*{min-width:0}
.kicker{color:var(--cyan);font-weight:500;margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;line-height:.94;font-size:clamp(34px,6.3vw,84px);letter-spacing:-.02em;perspective:700px;text-shadow:0 8px 40px rgba(7,6,26,.7)}
.line{display:block;white-space:nowrap}
.ch{display:inline-block;transform-origin:bottom}
.line.init{font-size:.5em;color:var(--gold);margin-bottom:.15em}
.line.mid{color:transparent;-webkit-text-stroke:1.5px var(--fg);text-shadow:none}
.line.mid .ch{-webkit-text-stroke:1.5px var(--fg)}
.line.last{color:#ff9a56;text-shadow:0 0 38px rgba(255,100,70,.55)}
.facts{display:flex;flex-wrap:wrap;gap:12px 30px;margin-top:26px}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-block;padding:13px 24px;border-radius:99px;font-weight:700;border:1px solid rgba(56,232,255,.55);background:rgba(10,8,34,.5);backdrop-filter:blur(8px)}
.btn:hover{box-shadow:0 0 28px rgba(56,232,255,.55)}
.btn.solid{border:0;color:#12061f;background:linear-gradient(100deg,var(--gold),var(--sunset) 55%,#ff5fa2)}
.btn.solid:hover{box-shadow:0 0 34px rgba(255,122,69,.7)}

.holo-stage{perspective:1100px;display:flex;flex-direction:column;align-items:center;gap:38px}
.holo{position:relative;width:min(330px,76vw);aspect-ratio:4/5;transform-style:preserve-3d}
.holo-orbit{position:absolute;inset:-18px;border:1px dashed rgba(181,107,255,.6);border-radius:36px;transform:translateZ(-60px);animation:breathe 5s ease-in-out infinite}
.holo-body{position:absolute;inset:0;overflow:hidden;border-radius:26px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(160deg,rgba(56,232,255,.16),rgba(181,107,255,.14),rgba(255,122,69,.2));backdrop-filter:blur(16px);box-shadow:0 0 60px rgba(181,107,255,.4),inset 0 0 40px rgba(56,232,255,.18)}
.holo-body img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.holo-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mute)}
.holo-initials{font-family:var(--display);font-weight:800;font-size:72px;background:linear-gradient(var(--cyan),var(--violet),var(--sunset));-webkit-background-clip:text;color:transparent}
.holo-scan{position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 3px,rgba(56,232,255,.07) 3px 4px)}
.holo-scan::after{content:"";position:absolute;left:0;right:0;height:90px;background:linear-gradient(transparent,rgba(56,232,255,.28),transparent);animation:scan 3.6s linear infinite}
.holo-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);background-size:250% 100%;mix-blend-mode:screen}
.holo-tag{position:absolute;padding:8px 14px;border-radius:12px;background:rgba(10,8,34,.82);border:1px solid rgba(56,232,255,.4);font-size:13px;white-space:nowrap}
.holo-tag.coords{top:20px;right:-14px;transform:translateZ(55px);color:var(--cyan);font-variant-numeric:tabular-nums}
.holo-tag.who{bottom:-18px;left:-14px;transform:translateZ(80px);display:flex;flex-direction:column;border-color:rgba(255,200,87,.5)}
.holo-tag b{font-family:var(--display);font-size:20px;color:var(--gold)}

.block{padding-block:120px}
.h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,60px);line-height:1.08;text-wrap:balance}
.h2 em{font-style:normal;color:var(--cyan)}
.lede{color:var(--mute);margin-top:10px}
.manifesto{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.6vw,72px);line-height:1.1;margin-block:40px 64px;perspective:800px}
.m-line{display:block}
.w{display:inline-block}
.grad .w{color:var(--cyan);text-shadow:0 0 34px rgba(56,232,255,.5)}
.warm .w{color:var(--gold);text-shadow:0 0 34px rgba(255,150,70,.55)}
.glass{background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);border-radius:22px;backdrop-filter:blur(18px);background-color:rgba(10,8,34,.5)}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;perspective:900px}
.value{padding:26px}
.value h3{font-family:var(--display);font-size:24px;color:var(--violet);margin-bottom:8px}

.marquee{overflow:hidden;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:clamp(36px,7vw,90px);line-height:1.2;transform:rotate(-3deg) scale(1.05);padding-block:14px;background:rgba(10,8,34,.6);border-block:1px solid rgba(181,107,255,.5)}
.marquee>div{width:max-content}
.marquee .hollow{color:transparent;-webkit-text-stroke:1.5px var(--sunset)}

.skills{height:420vh;position:relative}
.skills-sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:26px;padding-top:56px;text-align:center}
.orbit{--w:min(290px,68vw);--r:calc(var(--w)*1.12);height:390px;perspective:1300px;position:relative;touch-action:pan-y;user-select:none}
.orbit-ring{--spin:0deg;position:absolute;left:50%;top:0;width:var(--w);height:100%;margin-left:calc(var(--w)/-2);transform-style:preserve-3d;transform:translateZ(calc(var(--r)*-1)) rotateY(var(--spin));transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.slot{position:absolute;inset:0;transform:rotateY(var(--a)) translateZ(var(--r));backface-visibility:hidden}
.skill{--mx:50%;--my:0%;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 22px;border-radius:26px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:radial-gradient(circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 38%,transparent),transparent 62%),rgba(12,9,38,.88);opacity:.55;transition:opacity .4s,transform .4s cubic-bezier(.3,1.6,.5,1),box-shadow .4s}
.skill.on{opacity:1;box-shadow:0 0 55px color-mix(in srgb,var(--c) 45%,transparent)}
.skill:hover{transform:translateY(-12px) scale(1.04)}
.skill-icon{width:96px;height:96px;display:grid;place-items:center;border-radius:28px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);filter:drop-shadow(0 0 14px var(--c))}
.skill-icon svg{width:56px;height:56px}
.skill.on .skill-icon{animation:float 3s ease-in-out infinite}
.skill h3{font-family:var(--display);font-size:21px;line-height:1.2}
.skill p{color:var(--mute);font-size:14px}
.skill ul{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:auto}
.skill li{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--c)}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:30px;height:24px;display:grid;place-items:center}
.dots button::after{content:"";width:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.25);transition:.3s}
.dots button[aria-current="true"]::after{width:28px;background:var(--c);box-shadow:0 0 14px var(--c)}

#inbox .wrap{max-width:900px}
.h2 em.anon{color:var(--gold);text-shadow:0 0 30px rgba(255,200,87,.5)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;margin-block:28px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(10,8,34,.7)}
.tabs button{position:relative;padding:14px 10px;border-radius:16px;font-weight:700;min-width:0;line-height:1.3}
.tabs button span:last-child{position:relative}
.tabs .pill{position:absolute;inset:0;border-radius:16px;background:linear-gradient(100deg,#5a2bb5,#a53a86)}
.form{padding:clamp(18px,4vw,32px)}
.form-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.badge{display:flex;align-items:center;gap:8px;padding:6px 16px;border-radius:99px;color:#12061f;background:var(--cyan);box-shadow:0 0 28px rgba(56,232,255,.65);font-family:var(--display);font-size:17px}
.badge i{width:8px;height:8px;border-radius:9px;background:#12061f;animation:blink 1.4s infinite}
.si{font-family:'Noto Sans Sinhala','Iskoola Pota',sans-serif;font-size:clamp(17px,2.6vw,21px);line-height:1.7;color:var(--gold);margin-block:16px 12px;font-weight:600}
textarea{display:block;width:100%;resize:vertical;min-height:130px;padding:16px;border-radius:14px;background:rgba(4,3,18,.7);border:1px solid rgba(255,255,255,.16);transition:.3s}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 30px rgba(56,232,255,.3);outline:none}
.meter{height:3px;margin-top:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .2s}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;color:var(--mute);font-variant-numeric:tabular-nums}
.demo-note{font-size:13px;color:var(--mute);margin-top:14px}
.toast{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 18px;border-radius:14px;border:1px solid var(--cyan);background:rgba(56,232,255,.12)}
.toast.warn{border-color:var(--sunset);background:rgba(255,122,69,.14)}
.toast svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.wall-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-block:44px 16px}
.wall-head h3{font-family:var(--display);font-size:24px}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.live i{width:8px;height:8px;border-radius:9px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 1.4s infinite}
.btn:disabled{opacity:.6;cursor:progress}
.form{position:relative}
.burst{position:absolute;right:70px;bottom:90px;pointer-events:none}
.burst span{position:absolute;width:9px;height:9px;border-radius:9px}
.empty{padding:34px;text-align:center;border:1px dashed rgba(181,107,255,.55);border-radius:20px;color:var(--mute);background:rgba(10,8,34,.5)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px;perspective:900px}
.note{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note footer{display:flex;justify-content:space-between;margin-top:auto;font-size:13px;color:var(--mute)}
.note b{color:var(--cyan)}
.foot{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:50px var(--gr) 60px var(--gx);font-family:var(--display);font-weight:700}

.glow,.cursor-ring{position:fixed;left:0;top:0;pointer-events:none;border-radius:50%}
.glow{z-index:2;width:420px;height:420px;margin:-210px;background:radial-gradient(circle,rgba(181,107,255,.2),rgba(56,232,255,.07) 40%,transparent 68%);mix-blend-mode:screen}
.cursor-ring{z-index:50;width:30px;height:30px;margin:-15px;border:1.5px solid var(--cyan);transition:width .2s,height .2s,margin .2s,background .2s}
.cursor-ring.hot{width:52px;height:52px;margin:-26px;background:rgba(56,232,255,.14);border-color:var(--gold)}

.ai-fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:35;padding:12px 18px;border-radius:99px;font-family:var(--display);font-weight:800;font-size:14px;color:#12061f;background:linear-gradient(100deg,var(--cyan),var(--violet));box-shadow:0 0 28px rgba(56,232,255,.45)}
.ai-panel{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(72px,calc(env(safe-area-inset-bottom,0px) + 72px));z-index:35;width:min(360px,calc(100vw - 36px));max-height:460px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;border:1px solid rgba(56,232,255,.4);background:rgba(10,8,34,.92);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.ai-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12);font-family:var(--display);font-weight:700;color:var(--cyan)}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.ai-msg{padding:10px 12px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-msg.user{align-self:flex-end;background:rgba(181,107,255,.25);border:1px solid rgba(181,107,255,.45)}
.ai-msg.bot{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.ai-form{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.12)}
.ai-form input{flex:1;min-width:0;padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(4,3,18,.75);color:var(--fg);font:inherit;font-size:14px}
.ai-form input:focus{outline:none;border-color:var(--cyan)}

.universe{padding-block:100px 40px;text-align:center}
.universe canvas{display:block;width:100%;height:min(560px,100vw);margin-top:10px;touch-action:pan-y;cursor:grab;background:radial-gradient(closest-side,rgba(7,6,26,.88) 40%,rgba(7,6,26,.6) 70%,transparent)}
.holo-stage{position:relative}
.holo-stage::before,.holo-stage::after{content:"";position:absolute;left:50%;bottom:-150px;width:360px;max-width:92vw;aspect-ratio:1;translate:-50% 0;border-radius:50%;pointer-events:none;border:2px dashed rgba(56,232,255,.65);box-shadow:0 0 40px rgba(56,232,255,.35),inset 0 0 50px rgba(181,107,255,.35);transform:perspective(700px) rotateX(76deg) rotateZ(0deg);animation:platter 14s linear infinite}
.holo-stage::after{width:260px;bottom:-100px;border:2px dotted rgba(255,200,87,.7);animation-duration:9s;animation-direction:reverse}
@keyframes platter{to{transform:perspective(700px) rotateX(76deg) rotateZ(360deg)}}
.values,.wall{perspective:900px}
.value,.note{transition:rotate .15s ease-out,box-shadow .25s}
.value:hover,.note:hover{box-shadow:0 18px 50px rgba(56,232,255,.25)}
.spark{position:fixed;z-index:45;width:7px;height:7px;margin:-3.5px;border-radius:50%;pointer-events:none}
.game .wrap{max-width:900px}
.game-bar{display:flex;flex-wrap:wrap;gap:8px 28px;margin-block:22px 12px;color:var(--mute);font-variant-numeric:tabular-nums}
.game-bar b{color:var(--gold);font-size:20px}
.game-box{position:relative;height:min(520px,70svh);border-radius:22px;overflow:hidden;border:1px solid rgba(56,232,255,.45);box-shadow:0 0 55px rgba(181,107,255,.35)}
.game-box canvas{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.game-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;background:rgba(7,6,26,.55);font-weight:700}
@media (max-width:420px){.top{padding-left:12px}.top div button{padding:6px 5px}}
@keyframes scan{from{top:-90px}to{top:100%}}
@keyframes breathe{50%{opacity:.35;inset:-28px}}
@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes blink{50%{opacity:.25}}

@media (max-width:820px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:56px}
  h1{font-size:clamp(34px,11.2vw,80px)}
  .values{grid-template-columns:minmax(0,1fr)}
  .tabs{grid-template-columns:1fr}
  .top .mark{font-size:14px}
  .top div button{padding:6px 8px;font-size:13px}
}
@media (max-height:640px){.skills-sticky header .lede{display:none}.skills-sticky{gap:10px}.orbit{height:350px}.skill{padding:18px;gap:8px}.skill-icon{width:70px;height:70px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute)}

<script>
const { useEffect, useRef, useState } = React;
const { motion, AnimatePresence, MotionConfig, useMotionValue, useSpring, useTransform, useScroll, useReducedMotion } = Motion;
gsap.registerPlugin(ScrollTrigger);
const PROFILE = window.PROFILE;
const ageToday = () => {
  const b = new Date(PROFILE.born + "T00:00:00"), n = new Date();
  const before = n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate());
  return n.getFullYear() - b.getFullYear() - (before ? 1 : 0);
};
const world = { p: 0, x: 0, y: 0 };
const basicVert = `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const skyFrag = `
uniform float uNight; varying vec3 vP;
void main(){
  vec3 d = normalize(vP);
  float h = clamp(d.y*1.8+.05, 0., 1.);
  vec3 dusk = mix(vec3(1.,.45,.18), vec3(.36,.09,.46), smoothstep(0.,.32,h));
  dusk = mix(dusk, vec3(.025,.02,.09), smoothstep(.25,.85,h));
  vec3 night = mix(vec3(.12,.07,.28), vec3(.012,.012,.045), smoothstep(0.,.5,h));
  vec3 c = mix(dusk, night, uNight);
  float s = max(dot(d, normalize(vec3(.28,.075-uNight*.2,-1.))), 0.);
  c += vec3(1.,.72,.32) * (smoothstep(.9945,.9958,s) + pow(s,60.)*.45) * (1.-uNight);
  gl_FragColor = vec4(c,1.);
}`;
const seaVert = `
uniform float uT; varying vec3 vW; varying float vH;
void main(){
  vec3 p = position;
  float h = sin(p.x*.35+uT)*.22 + sin(p.y*.55+uT*1.4)*.18 + sin((p.x+p.y)*.9+uT*2.)*.05;
  p.z += h; vH = h;
  vec4 w = modelMatrix*vec4(p,1.); vW = w.xyz;
  gl_Position = projectionMatrix*viewMatrix*w;
}`;
const seaFrag = `
uniform float uT, uNight; varying vec3 vW; varying float vH;
void main(){
  vec2 g = abs(fract(vec2(vW.x, vW.z + uT*.8)*.55)-.5);
  float line = smoothstep(.455,.5,max(g.x,g.y));
  float dist = length(vW.xz - cameraPosition.xz);
  float fade = 1.-smoothstep(12.,58.,dist);
  vec3 neon = mix(vec3(.13,.9,1.), vec3(.66,.3,1.), smoothstep(-.25,.3,vH));
  vec3 c = vec3(.018,.016,.06) + neon*line*fade*.75;
  float glint = exp(-pow((vW.x-8.-(-vW.z)*.12)/3.2,2.)) * (1.-uNight);
  c += vec3(1.,.5,.2)*glint*(.12+.5*max(vH,0.))*smoothstep(2.,20.,dist);
  vec3 horizon = mix(vec3(.5,.18,.3), vec3(.09,.05,.2), uNight);
  c = mix(c, horizon, smoothstep(30.,70.,dist));
  gl_FragColor = vec4(c,1.);
}`;
function buildScene(canvas, still) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
  camera.position.set(0, 0.6, 9);
  const basic = (color, extra) => new THREE.MeshBasicMaterial({ color, ...extra });
  const add = (parent, geo, mat, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  };
  const sky = { uNight: { value: 0 } };
  const sea = { uT: { value: 0 }, uNight: { value: 0 } };
  add(scene, new THREE.SphereGeometry(90, 48, 32), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: sky, vertexShader: basicVert, fragmentShader: skyFrag }));
  add(scene, new THREE.PlaneGeometry(170, 130, 170, 130), new THREE.ShaderMaterial({ uniforms: sea, vertexShader: seaVert, fragmentShader: seaFrag }), 0, -2.4, -20).rotation.x = -Math.PI / 2;
  const pos = new Float32Array(900 * 3);
  for (let i = 0; i < 900; i++) pos.set([(Math.random() - 0.5) * 110, Math.random() * 34 + 0.5, -Math.random() * 60 - 8], i * 3);

<script>
// Visual effects only: 3D tilt on cards and sparks on click
if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  document.addEventListener("pointermove", (e) => {
    const card = e.pointerType === "mouse" && e.target.closest(".value,.note");
    if (window.tilted && window.tilted !== card) window.tilted.style.rotate = "";
    window.tilted = card || null;
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    card.style.rotate = `${-y} ${x} 0 ${Math.hypot(x, y) * 22}deg`;
  });
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest("input,textarea,.ai-panel,.game-box")) return;
    for (let i = 0; i < 14; i++) {
      const dot = document.createElement("span"), a = i / 14 * Math.PI * 2, d = 35 + Math.random() * 45;
      dot.className = "spark";
      dot.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;background:${["#38e8ff", "#b56bff", "#ffc857"][i % 3]}`;
      document.body.appendChild(dot);
      dot.animate([{ transform: "none", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }], { duration: 650, easing: "ease-out" }).onfinish = () => dot.remove();
    }
  });
}
</script>
